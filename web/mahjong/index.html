<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2318">
<title>四川麻将</title>
<style>
:root {
  --gold: #ffd76a;
  --red: #c0282d;
  --chip: rgba(0, 0, 0, .4);
  --kai: MJKai, "Kaiti SC", "STKaiti", "KaiTi", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: #0d2318;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
#viewport {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  align-items: center;
  justify-content: center;
}
#stage {
  position: relative;
  flex: none;
  width: 844px;
  height: 390px;
  border-radius: 18px;
  overflow: hidden;
  color: #fff;
  background: radial-gradient(ellipse at 50% 45%, #2f8a5d 0%, #1d6644 55%, #123f2a 100%);
  transform-origin: center;
}
#stage::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .18;
  background-image: repeating-linear-gradient(45deg, rgba(0, 0, 0, .25) 0 1px, transparent 1px 3px);
  pointer-events: none;
}
.abs { position: absolute; }
svg.tile { display: block; flex: none; }
.row { display: flex; align-items: flex-end; }

#topbar a, #topbar button { font-size: 12px; opacity: .8; color: #fff; text-decoration: none; padding: 4px 6px; }
#topbar a:hover, #topbar button:hover { opacity: 1; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--chip);
  font-size: 11px;
  padding: 3px 8px 3px 3px;
  border-radius: 12px;
  white-space: nowrap;
}
.chip .av {
  width: 18px; height: 18px; border-radius: 50%;
  background: #e9d9a8; color: #5a3d12;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
.chip.turn { box-shadow: 0 0 0 2px var(--gold); }
.chip b { color: var(--gold); }
.chip .neg { color: #9fd3ff; }
.badge { border-radius: 3px; padding: 0 3px; font-weight: 700; }
.badge.dealer { background: #d4a017; color: #3a2800; }
.badge.que { background: var(--red); }
.badge.won { background: var(--gold); color: #5a1d00; }

.side-col { display: flex; flex-direction: column; gap: 1px; align-items: center; }
.side-tile { width: 22px; height: 14px; border-radius: 3px; background: linear-gradient(90deg, #f4f4f4 0 30%, #22399c 30% 100%); box-shadow: 0 1px 0 #0e1c5a; }
.right .side-tile { background: linear-gradient(270deg, #f4f4f4 0 30%, #22399c 30% 100%); }
.meld { display: flex; gap: 0; margin: 2px; }
.grid { display: grid; gap: 1px 0; }
.grid .last { filter: drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 2px var(--gold)); }

#center {
  left: 50%; top: 168px;
  width: 140px; height: 72px;
  transform: translate(-50%, -50%);
  border-radius: 12px;
  background: rgba(0, 0, 0, .35);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
  text-align: center;
  font-size: 12px;
}
#center .dice { display: flex; justify-content: center; gap: 6px; height: 28px; margin-top: 5px; }
#center .remain b { color: var(--gold); font-size: 15px; }
#center .phase { font-size: 10px; opacity: .85; margin-top: 1px; }
#center .arrow { position: absolute; width: 0; height: 0; border: 6px solid transparent; opacity: .2; }
#center .arrow.on { opacity: 1; }
#center .a0 { bottom: -13px; left: 50%; margin-left: -6px; border-top-color: var(--gold); }
#center .a1 { right: -13px; top: 50%; margin-top: -6px; border-left-color: var(--gold); }
#center .a2 { top: -13px; left: 50%; margin-left: -6px; border-bottom-color: var(--gold); }
#center .a3 { left: -13px; top: 50%; margin-top: -6px; border-right-color: var(--gold); }

#hand { left: 12px; bottom: 8px; }
#hand .h { margin: 0 1px; transition: transform .12s; cursor: pointer; }
#hand .h.sel { transform: translateY(-12px); }
#hand .h.drawn { margin-left: 12px; }
#hand .h.dim { filter: brightness(.6); }
#hand .h { position: relative; }
#hand .h.ting::after { content: ""; position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 1px #7a5200; }
#mybar { display: flex; gap: 6px; align-items: center; font-size: 12px; }
#hint { display: flex; gap: 6px; align-items: center; }
.col { display: flex; flex-direction: column; align-items: center; gap: 3px; transform-origin: top center; }
#hint .tip { background: var(--chip); padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
#hint .tip b { color: var(--gold); font-weight: 600; }
#hint .tip.fan { background: rgba(120, 10, 10, .8); }
.act.hu.glow { animation: glow 1s ease-in-out infinite alternate; transform: scale(1.12); }
@keyframes glow { from { box-shadow: 0 0 6px 2px rgba(255, 215, 106, .6), 0 3px 0 rgba(0, 0, 0, .35) } to { box-shadow: 0 0 18px 6px rgba(255, 215, 106, .95), 0 3px 0 rgba(0, 0, 0, .35) } }
#center .dice.rolling svg { animation: shake .12s linear infinite; }
#center .dice.hl svg { filter: drop-shadow(0 0 4px var(--gold)) drop-shadow(0 0 2px var(--gold)); }
@keyframes shake { 0% { transform: rotate(-14deg) translateY(-2px) } 50% { transform: rotate(14deg) translateY(2px) } 100% { transform: rotate(-14deg) translateY(-2px) } }
#wall { inset: 0; pointer-events: none; }
.wall-row { position: absolute; display: flex; gap: 1px; }
.wall-row i { width: 9px; height: 13px; border-radius: 2px; background: linear-gradient(#2d4bb8, #16287a); box-shadow: 0 2px 0 #f4f4f4; }
.wall-row i.cut { background: none; box-shadow: none; }
.wall-row.v { flex-direction: column; }
.wall-row.v i { width: 13px; height: 9px; }
#hand .melds { margin-left: 14px; }

#actions { right: 16px; bottom: 88px; display: flex; gap: 8px; align-items: flex-end; }
.act {
  width: 50px; height: 50px; border-radius: 50%;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--kai); font-size: 20px; color: #fff;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .4);
}
.act small { font-family: system-ui; font-size: 9px; line-height: 1; opacity: .9; }
.act.peng { background: radial-gradient(circle at 35% 30%, #f2a33a, #b8670f); }
.act.gang { background: radial-gradient(circle at 35% 30%, #a578e6, #5b2fa3); }
.act.hu { background: radial-gradient(circle at 35% 30%, #ef5350, #9f1c1c); }
.act.pass { background: radial-gradient(circle at 35% 30%, #8a8a8a, #444); }
.act.ok { background: radial-gradient(circle at 35% 30%, #4caf7a, #1e6b44); width: 64px; border-radius: 25px; font-size: 16px; }
.act:disabled { filter: grayscale(1) brightness(.7); cursor: default; }

.big-btn {
  padding: 10px 22px; border-radius: 22px;
  background: radial-gradient(circle at 35% 30%, #f2a33a, #b8670f);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
  font-family: var(--kai); font-size: 18px; color: #fff;
}
#prompt { left: 50%; top: 226px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; font-size: 13px; white-space: nowrap; }
#prompt .tip { background: var(--chip); padding: 4px 10px; border-radius: 10px; }
.que-btn { padding: 8px 16px; border-radius: 18px; background: rgba(0, 0, 0, .45); font-family: var(--kai); font-size: 17px; }
.que-btn.rec { box-shadow: 0 0 0 2px var(--gold); }

#toast { left: 50%; top: 116px; transform: translateX(-50%); pointer-events: none; }
.discard-pop { pointer-events: none; transform: translate(-50%, -50%); animation: dpop 1.1s ease forwards; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45)); z-index: 5; }
@keyframes dpop { 0% { transform: translate(-50%, -50%) scale(.5); opacity: 0 } 12% { transform: translate(-50%, -50%) scale(1.08); opacity: 1 } 22% { transform: translate(-50%, -50%) scale(1) } 80% { opacity: 1 } 100% { opacity: 0 } }
.toast-msg { font-family: var(--kai); font-size: 26px; color: var(--gold); text-shadow: 0 2px 4px rgba(0, 0, 0, .6); animation: pop 1.2s ease forwards; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 15% { transform: scale(1.1); opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }

#modal { inset: 0; background: rgba(0, 0, 0, .55); display: none; align-items: center; justify-content: center; z-index: 10; }
#modal.open { display: flex; }
.panel { position: relative; display: flex; flex-direction: column; background: #f8f0dd; color: #2b2620; border-radius: 12px; width: 640px; max-height: 372px; padding: 12px 16px; }
.panel .body { flex: 1; min-height: 0; overflow: auto; }
.panel h2 { font-family: var(--kai); font-size: 20px; margin-bottom: 8px; }
.panel .x { position: absolute; right: 8px; top: 6px; width: 36px; height: 36px; font-size: 24px; line-height: 1; color: #6b6355; }
.panel .btns { display: flex; gap: 10px; justify-content: flex-end; padding-top: 10px; }
.panel .btn { padding: 8px 18px; border-radius: 16px; background: #e2d4b6; color: #2b2620; font-size: 13px; }
.panel .btn.pri { background: #a63a2a; color: #fff; }
.res { display: grid; grid-template-columns: 70px 1fr 64px 60px; gap: 4px 10px; align-items: center; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #e2d4b6; }
.res .who { font-weight: 700; }
.res .delta { font-size: 16px; font-weight: 700; text-align: right; }
.res .up { color: #a63a2a; }
.res .down { color: #2f6b9a; }
.res .tot { color: #6b6355; text-align: right; }
.res .tiles { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0; margin-top: 3px; }
.res .tiles .meld { margin: 0 0 0 6px; }
.res .fan { color: #6b6355; }
.flow { font-size: 12px; color: #4a4338; margin-top: 8px; columns: 2; }
.flow div { padding: 1px 0; break-inside: avoid; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e2d4b6; font-size: 13px; }
.seg { display: inline-flex; border-radius: 14px; overflow: hidden; background: #e2d4b6; }
.seg button { padding: 4px 10px; font-size: 12px; }
.seg button.on { background: #a63a2a; color: #fff; }

</style>
</head>
<body>
<div id="defs"></div>
<div id="viewport">
  <div id="stage">
    <div id="topbar">
      <a class="abs" style="left:10px;top:4px" href="../">← 全部游戏</a>
      <button class="abs" style="right:10px;top:4px" id="btnSettings">⚙︎ 设置</button>
    </div>
    <div id="seat2" class="abs" style="left:50%;top:6px;transform:translateX(-50%)"></div>
    <div id="disc2" class="abs" style="left:50%;top:40px;transform:translateX(-50%)"></div>
    <div id="seat3" class="abs" style="left:10px;top:30px"></div>
    <div id="col3" class="abs col" style="left:12px;top:56px"></div>
    <div id="disc3" class="abs" style="left:50px;top:72px"></div>
    <div id="seat1" class="abs" style="right:10px;top:30px"></div>
    <div id="col1" class="abs col right" style="right:12px;top:56px"></div>
    <div id="disc1" class="abs" style="right:50px;top:72px"></div>
    <div id="center" class="abs"></div>
    <div id="disc0" class="abs" style="left:50%;top:208px;transform:translateX(-50%)"></div>
    <div id="mybar" class="abs" style="left:12px;top:282px"><span id="chip0"></span><span id="hint"></span></div>
    <div id="prompt" class="abs"></div>
    <div id="hand" class="abs row"></div>
    <div id="actions" class="abs"></div>
    <div id="wall" class="abs"></div>
    <div id="toast" class="abs"></div>
    <div id="modal" class="abs"></div>
  </div>
</div>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="tiles.js"></script>
<script>
const SEAT_NAMES = ["你", "下家", "对家", "上家"]
const SUIT_NAMES = ["万", "条", "筒"]
const ORDER_MARK = ["", "①", "②", "③"]
const $ = id => document.getElementById(id)
const T = MJTiles
$("defs").innerHTML = T.defs()

const SAVE_KEY = "mj.save"
const SPEEDS = [[1500, "慢"], [1000, "中"], [500, "快"]]
let settings = { ai: [null, "normal", "normal", "normal"], cap: 3, speed: 1000, hintWaits: true, hintPreview: true, skipDice: false, sound: true }
let state = null
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY))
  if (saved?.settings) settings = { ...settings, ...saved.settings }
  if (saved?.state?.players?.length === 4) state = saved.state
} catch {}
if (!SPEEDS.some(([v]) => v === settings.speed)) settings.speed = 1000
state ??= MJ.newMatch({ seed: Date.now() >>> 0, cap: settings.cap })

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ state, settings }))
  } catch {}
}
let gen = 0
let selected = []
let countdown = null

// ---------- 布局缩放 ----------
function fit() {
  const vp = getComputedStyle($("viewport"))
  const w = innerWidth - parseFloat(vp.paddingLeft) - parseFloat(vp.paddingRight) - 8
  const h = innerHeight - parseFloat(vp.paddingTop) - parseFloat(vp.paddingBottom) - 8
  const sideways = h > w
  const k = sideways ? Math.min(h / 844, w / 390) : Math.min(w / 844, h / 390)
  $("stage").style.transform = `${sideways ? "rotate(90deg) " : ""}scale(${k})`
}
addEventListener("resize", fit)
fit()

// ---------- 渲染工具 ----------
const grid = (tiles, w, per, last = -1) =>
  `<div class="grid" style="grid-template-columns:repeat(${per},${w + 1}px)">${tiles.map((t, i) => T.face(t, w, i === last ? "tile last" : "tile")).join("")}</div>`

function rotated(html, w, h, deg) {
  const side = deg % 180 !== 0
  const [bw, bh] = side ? [h, w] : [w, h]
  return `<div style="position:relative;width:${bw}px;height:${bh}px"><div style="position:absolute;left:${(bw - w) / 2}px;top:${(bh - h) / 2}px;width:${w}px;transform:rotate(${deg}deg)">${html}</div></div>`
}

function discards(v, s, w, per, deg) {
  const p = v.players[s]
  if (!p.discards.length) return ""
  const isLast = v.lastDiscard?.seat === s && (v.phase === "claim" || v.turn !== s)
  const html = grid(p.discards, w, per, isLast ? p.discards.length - 1 : -1)
  const rows = Math.ceil(p.discards.length / per)
  return rotated(html, per * (w + 1), rows * (w * 1.4 + 1), deg)
}

function meld(m, w) {
  if (m.type === "anGang") {
    if (m.tile == null) return `<div class="meld">${[0, 1, 2, 3].map(() => T.flatBack(w)).join("")}</div>`
    return `<div class="meld">${T.flatBack(w)}${T.face(m.tile, w)}${T.face(m.tile, w)}${T.flatBack(w)}</div>`
  }
  return `<div class="meld">${Array.from({ length: m.type === "peng" ? 3 : 4 }, () => T.face(m.tile, w)).join("")}</div>`
}

const COL_MAX = 194
const roundScore = (v, s) => v.players[s].total + (v.phase === "ended" ? 0 : MJ.ledgerSum(v.ledger, s))

function chip(v, s) {
  const p = v.players[s]
  const score = roundScore(v, s)
  return `<span class="chip${v.turn === s && v.phase === "play" ? " turn" : ""}">
    <span class="av">${SEAT_NAMES[s][0]}</span>${SEAT_NAMES[s]}
    ${v.phase !== "dealerRoll" && v.dealer === s ? '<span class="badge dealer">庄</span>' : ""}
    <b class="${score < 0 ? "neg" : ""}">${score > 0 ? "+" : ""}${score}</b>
    ${p.que != null ? `<span class="badge que">缺${SUIT_NAMES[p.que]}</span>` : ""}
    ${p.won ? `<span class="badge won">胡${ORDER_MARK[p.won.order]}</span>` : ""}</span>`
}

const sortTiles = (tiles, que) => tiles.slice().sort((a, b) => (MJ.suitOf(a) === que ? -100 : 0) + a - ((MJ.suitOf(b) === que ? -100 : 0) + b))

function opponentHand(v, s, vertical) {
  const p = v.players[s]
  const w = vertical ? 15 : 18
  if (p.hand) {
    const tiles = sortTiles(p.hand, p.que).concat(p.won ? [p.won.tile] : [])
    const row = `<div class="row">${tiles.map(t => T.face(t, w)).join("")}</div>`
    return vertical ? rotated(row, tiles.length * w, w * 1.4, s === 3 ? 90 : -90) : row
  }
  const wonTile = p.won ? T.face(p.won.tile, w, "tile last") : ""
  if (vertical) return `<div class="side-col">${Array.from({ length: p.handCount }, () => T.side()).join("")}</div>${p.won ? rotated(wonTile, w, w * 1.4, s === 3 ? 90 : -90) : ""}`
  return `<div class="row">${Array.from({ length: p.handCount }, () => T.back(18)).join("")}<span style="width:6px"></span>${wonTile}</div>`
}

function opponentMelds(v, s, vertical) {
  const ms = v.players[s].melds
  if (!ms.length) return ""
  const w = 18
  return ms.map(m => {
    const html = meld(m, w)
    const n = m.type === "peng" ? 3 : 4
    return vertical ? rotated(html, n * w + 4, w * 1.4 + 4, s === 3 ? 90 : -90) : html
  }).join("")
}

// ---------- 渲染 ----------
function myTiles(v) {
  const p = v.players[0]
  const tiles = sortTiles(p.hand, p.que)
  let drawn = null
  if (v.phase === "play" && v.turn === 0 && v.drawn != null) {
    tiles.splice(tiles.lastIndexOf(v.drawn), 1)
    drawn = v.drawn
  }
  return { tiles, drawn }
}

function render() {
  const v = MJ.view(state, 0)
  const legal = MJ.legalActions(state, 0)

  $("seat2").innerHTML = `<div class="row" style="gap:8px;align-items:flex-start">${chip(v, 2)}${opponentHand(v, 2, false)}<div class="row">${opponentMelds(v, 2, false)}</div></div>`
  for (const s of [1, 3]) {
    $("seat" + s).innerHTML = chip(v, s)
    const col = $("col" + s)
    col.style.transform = ""
    col.innerHTML = opponentHand(v, s, true) + opponentMelds(v, s, true)
    if (col.scrollHeight > COL_MAX) col.style.transform = `scale(${COL_MAX / col.scrollHeight})`
  }
  $("disc2").innerHTML = discards(v, 2, 20, 12, 180)
  $("disc3").innerHTML = discards(v, 3, 21, 7, 90)
  $("disc1").innerHTML = discards(v, 1, 21, 7, -90)
  $("disc0").innerHTML = discards(v, 0, 20, 12, 0)
  $("chip0").innerHTML = chip(v, 0)

  const dice = v.dice ? diceHTML(v.dice.values) : ""
  $("center").innerHTML = `<div class="${diceClass()}">${dice}</div>
    <div class="remain">剩余 <b>${v.wallCount}</b> 张</div>
    <div class="phase">${phaseText(v)}</div>
    ${[0, 1, 2, 3].map(s => `<span class="arrow a${s}${activeSeat(v) === s ? " on" : ""}"></span>`).join("")}`

  renderHand(v)
  renderActions(v, legal)
  renderHints(v, legal)
  renderWall(v)
}

function remaining(v) {
  return MJAI.visibleCounts(v).map(n => 4 - n)
}

function discardTing(v) {
  const p = v.players[0]
  const out = new Map()
  for (const t of new Set(p.hand)) {
    const h = p.hand.slice()
    h.splice(h.indexOf(t), 1)
    const w = MJ.waits(h, p.que)
    if (w.length) out.set(t, w)
  }
  return out
}

const waitText = (ws, rem) => ws.map(t => `${T.name(t)}<b>(${Math.max(0, rem[t])})</b>`).join(" ")

function huFan(v, legal) {
  if (!legal.some(a => a.type === "hu")) return null
  const p = v.players[0]
  if (v.phase === "claim") {
    return MJ.scoreHand({ hand: p.hand, melds: p.melds, winTile: v.claim.tile, flags: { gangShangPao: v.gangFlag?.seat === v.claim.from && v.claim.kind === "discard", qiangGang: v.claim.kind === "qiangGang" } }, v.cap)
  }
  const rest = p.hand.slice()
  rest.splice(rest.indexOf(v.drawn), 1)
  return MJ.scoreHand({ hand: rest, melds: p.melds, winTile: v.drawn, selfDrawn: true, flags: { gangShangHua: v.afterGang, haidi: v.wallCount === 0 } }, v.cap)
}

function fanText(r) {
  const parts = r.items.map(i => `${i.name} ${i.fan}`).join(" + ")
  return `${parts} = ${r.fan} 番${r.cappedFan < r.fan ? ` → 封顶 ${r.cappedFan} 番` : ""} = ${r.base} 底`
}

function renderHints(v, legal) {
  const p = v.players[0]
  const tips = []
  const rem = remaining(v)
  const queLeft = p.que != null && p.hand.some(t => MJ.suitOf(t) === p.que)
  if (v.phase === "play" && v.turn === 0 && settings.hintPreview && selected.length === 1) {
    const t = JSON.parse($("hand").dataset.tiles)[selected[0]]
    const ws = discardTing(v).get(t)
    if (ws && !queLeft) tips.push(`打${T.name(t)}听 ${waitText(ws, rem)} · 共剩 <b>${ws.reduce((a, x) => a + Math.max(0, rem[x]), 0)}</b> 张`)
  } else if (settings.hintWaits && !p.won && p.hand.length % 3 === 1 && ["play", "claim"].includes(v.phase)) {
    const ws = MJ.waits(p.hand, p.que)
    if (ws.length) tips.push(`听 ${waitText(ws, rem)}`)
  }
  const fan = huFan(v, legal)
  $("hint").innerHTML = tips.map(t => `<span class="tip">${t}</span>`).join("") + (fan ? `<span class="tip fan">${fanText(fan)}</span>` : "")
  $("actions").querySelector(".act.hu")?.classList.add("glow")
}

const WALL_STACKS = [14, 13, 14, 13]
let wallUntil = 0
function renderWall(v) {
  const show = v.phase === "break" || Date.now() < wallUntil
  if (!show) return ($("wall").innerHTML = "")
  const cut = v.breakAt
  const pos = [
    { cls: "", style: "left:50%;top:208px;transform:translateX(-50%);flex-direction:row-reverse" },
    { cls: "v", style: "left:520px;top:50%;transform:translateY(-50%)" },
    { cls: "", style: "left:50%;top:114px;transform:translateX(-50%)" },
    { cls: "v", style: "left:310px;top:50%;transform:translateY(-50%);flex-direction:column-reverse" },
  ]
  $("wall").innerHTML = pos.map((o, s) => `<div class="wall-row ${o.cls}" style="${o.style}">${Array.from({ length: WALL_STACKS[s] }, (_, i) =>
    `<i class="${cut && cut.wallSeat === s && i === WALL_STACKS[s] - cut.stack ? "cut" : ""}"></i>`).join("")}</div>`).join("")
}

function activeSeat(v) {
  if (v.phase === "play") return v.turn
  if (v.phase === "claim") return v.claim.from
  return -1
}

function phaseText(v) {
  switch (v.phase) {
    case "dealerRoll": return "掷骰定庄"
    case "break": return `${SEAT_NAMES[v.dealer]}掷骰开牌`
    case "exchange": return "换三张"
    case "exchangeRoll": return `${SEAT_NAMES[v.dealer]}掷骰定方向`
    case "que": return "定缺"
    case "claim": return `${SEAT_NAMES[v.claim.from]}打出 ${T.name(v.claim.tile)}`
    case "play": return v.turn === 0 ? "▼ 轮到你出牌" : `${SEAT_NAMES[v.turn]}思考中`
    case "ended": return "本局结束"
  }
}

function renderHand(v) {
  const p = v.players[0]
  const { tiles, drawn } = myTiles(v)
  const all = drawn == null ? tiles : tiles.concat([drawn])
  const queLeft = p.que != null && p.hand.some(t => MJ.suitOf(t) === p.que)
  const tingTiles = settings.hintPreview && v.phase === "play" && v.turn === 0 && !queLeft ? new Set(discardTing(v).keys()) : new Set()
  const handHtml = all.map((t, i) => {
    const cls = ["h"]
    if (selected.includes(i)) cls.push("sel")
    if (drawn != null && i === all.length - 1) cls.push("drawn")
    if (queLeft && v.phase === "play" && MJ.suitOf(t) !== p.que) cls.push("dim")
    if (v.phase === "exchange" && !p.exchangeOut && !exchangeable(t)) cls.push("dim")
    if (tingTiles.has(t)) cls.push("ting")
    return `<div class="${cls.join(" ")}" data-i="${i}">${T.face(t, 46)}</div>`
  }).join("")
  const wonTile = p.won ? `<div class="h drawn">${T.face(p.won.tile, 46, "tile last")}</div>` : ""
  $("hand").innerHTML = handHtml + wonTile + `<div class="melds row">${p.melds.map(m => meld(m, 32)).join("")}</div>`
  $("hand").dataset.tiles = JSON.stringify(all)
}

function renderActions(v, legal) {
  const acts = []
  const prompt = []
  const has = type => legal.find(a => a.type === type)
  if (has("roll")) prompt.push(`<button class="big-btn" data-act='{"type":"roll"}'>🎲 掷骰</button>`)
  if (v.phase === "exchange" && legal.length) {
    const tiles = selectedTiles()
    const ok = tiles.length === 3 && tiles.every(t => MJ.suitOf(t) === MJ.suitOf(tiles[0]))
    prompt.push(`<span class="tip">选 3 张同花色的牌换出</span>`)
    acts.push(`<button class="act ok" ${ok ? "" : "disabled"} data-act='${JSON.stringify({ type: "exchange", tiles })}'>确认</button>`)
  }
  if (v.phase === "que" && legal.length) {
    const rec = recommendQue(v.players[0].hand)
    prompt.push(`<span class="tip">定缺</span>` + [0, 1, 2].map(s => `<button class="que-btn${s === rec ? " rec" : ""}" data-act='{"type":"que","suit":${s}}'>缺${SUIT_NAMES[s]}</button>`).join(""))
  }
  if (has("hu")) acts.push(`<button class="act hu" data-act='{"type":"hu"}'>胡</button>`)
  for (const a of legal.filter(a => ["anGang", "buGang", "gang"].includes(a.type)))
    acts.push(`<button class="act gang" data-act='${JSON.stringify(a)}'>杠${a.tile != null ? `<small>${T.name(a.tile)}</small>` : ""}</button>`)
  if (has("peng")) acts.push(`<button class="act peng" data-act='{"type":"peng"}'>碰</button>`)
  if (has("pass")) acts.push(`<button class="act pass" data-act='{"type":"pass"}'>过<small id="cd">${cdLeft >= 0 ? cdLeft + "s" : ""}</small></button>`)
  if (v.phase === "ended") prompt.push(`<button class="big-btn" data-result style="background:radial-gradient(circle at 35% 30%,#8a8a8a,#444)">结算</button><button class="big-btn" data-next>再来一局</button>`)
  $("actions").innerHTML = acts.join("")
  $("prompt").innerHTML = prompt.join("")
}

function recommendQue(hand) {
  const n = [0, 1, 2].map(s => hand.filter(t => MJ.suitOf(t) === s).length)
  return n.indexOf(Math.min(...n))
}

const exchangeable = t => state.players[0].hand.filter(x => MJ.suitOf(x) === MJ.suitOf(t)).length >= 3

function defaultSelection() {
  const legal = MJ.legalActions(state, 0)
  if (state.phase !== "exchange" || !legal.length) return []
  const rec = MJAI.choose(MJ.view(state, 0), 0, legal, "normal", 1).tiles
  const all = sortTiles(state.players[0].hand, null)
  const out = []
  for (const t of rec) out.push(all.findIndex((x, i) => x === t && !out.includes(i)))
  return out
}

function selectedTiles() {
  const all = JSON.parse($("hand").dataset.tiles || "[]")
  return selected.map(i => all[i])
}

// ---------- 交互 ----------
$("hand").addEventListener("click", e => {
  const el = e.target.closest(".h[data-i]")
  if (!el) return
  const i = Number(el.dataset.i)
  const all = JSON.parse($("hand").dataset.tiles)
  const legal = MJ.legalActions(state, 0)
  if (state.phase === "exchange" && legal.length) {
    if (!exchangeable(all[i])) return
    if (selected.includes(i)) selected = selected.filter(x => x !== i)
    else if (selected.length && MJ.suitOf(all[selected[0]]) !== MJ.suitOf(all[i])) selected = [i]
    else if (selected.length < 3) selected.push(i)
    return render()
  }
  if (!legal.some(a => a.type === "discard" && a.tile === all[i])) return
  if (selected[0] === i) return act({ type: "discard", tile: all[i] })
  selected = [i]
  render()
})

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]")
  if (b && !b.disabled) act(JSON.parse(b.dataset.act))
  if (e.target.closest("[data-next]")) nextRound()
  if (e.target.closest("[data-result]")) showResult()
  if (e.target.closest("#btnSettings")) showSettings()
  if (e.target.closest("[data-close]")) closeModal()
  if (e.target.isConnected && $("modal").classList.contains("open") && !e.target.closest("#stage")) closeModal()
})

function act(a) {
  if (!MJ.legalActions(state, 0).some(x => x.type === a.type)) return
  setState(MJ.apply(state, 0, a))
}

let seenEvents = state.events.length
let selKey = ""
function setState(s) {
  state = s
  save()
  gen++
  const key = state.phase + "|" + state.players[0].hand.join() + "|" + state.drawn
  if (key !== selKey) selected = defaultSelection()
  selKey = key
  if (state.events.length < seenEvents) seenEvents = 0
  const fresh = state.events.slice(seenEvents)
  seenEvents = state.events.length
  render()
  for (const e of fresh) onEvent(e)
  schedule()
}

const TOAST_POS = [["50%", "250px"], ["700px", "150px"], ["50%", "86px"], ["140px", "150px"]]
function toast(seat, text) {
  const [x, y] = TOAST_POS[seat]
  const el = document.createElement("div")
  el.className = "toast-msg abs"
  el.style.cssText = `left:${x};top:${y};transform:translateX(-50%)`
  el.textContent = text
  $("stage").appendChild(el)
  setTimeout(() => el.remove(), 1300)
}

let diceAnim = { until: 0, hl: 0 }
function diceHTML(values) {
  const now = Date.now()
  if (now < diceAnim.until) return values.map(() => T.die(1 + Math.floor(Math.random() * 6), 26)).join("")
  return values.map(n => T.die(n, 26)).join("")
}
function diceClass() {
  const now = Date.now()
  return now < diceAnim.until ? "dice rolling" : now < diceAnim.hl ? "dice hl" : "dice"
}
function rollDice() {
  if (settings.skipDice) return
  const t0 = Date.now()
  diceAnim = { until: t0 + 650, hl: t0 + 1650 }
  const spin = setInterval(() => {
    const box = $("center").querySelector(".dice")
    if (box && state.dice) {
      box.className = diceClass()
      box.innerHTML = diceHTML(state.dice.values)
    }
    if (Date.now() > diceAnim.hl) clearInterval(spin)
  }, 70)
}

const POP_POS = [[422, 250], [640, 168], [422, 104], [204, 168]]
function popDiscard(seat, tile) {
  const el = document.createElement("div")
  el.className = "discard-pop abs"
  el.style.left = POP_POS[seat][0] + "px"
  el.style.top = POP_POS[seat][1] + "px"
  el.innerHTML = T.face(tile, 44)
  $("stage").appendChild(el)
  setTimeout(() => el.remove(), 1150)
}

function onEvent(e) {
  if (e.type === "discard") popDiscard(e.seat, e.tile)
  sound(e)
  if (e.type === "roll") rollDice()
  if (e.type === "deal") {
    wallUntil = Date.now() + (settings.skipDice ? 300 : 1400)
    renderWall(MJ.view(state, 0))
    setTimeout(() => renderWall(MJ.view(state, 0)), settings.skipDice ? 350 : 1450)
  }
  if (e.type === "peng") toast(e.seat, "碰")
  if (e.type === "gang") toast(e.seat, e.kind === "anGang" ? "暗杠" : "杠")
  if (e.type === "hu") toast(e.seat, e.selfDrawn ? "自摸" : "胡")
  if (e.type === "exchange") toast(0, ["", "换给下家", "换给对家", "换给上家"][e.dir])
}

// ---------- AI 驱动 ----------
let worker = null
const pending = new Map()
let reqId = 0
try {
  worker = new Worker("ai-worker.js")
  worker.onmessage = e => {
    const req = pending.get(e.data.id)
    pending.delete(e.data.id)
    req?.resolve(e.data.action)
  }
  worker.onerror = () => {
    worker = null
    for (const [id, req] of pending) {
      pending.delete(id)
      req.resolve(MJAI.choose(req.view, req.seat, req.actions, req.level, req.seed))
    }
  }
} catch {
  worker = null
}

function askAI(s) {
  const view = MJ.view(state, s)
  const actions = MJ.legalActions(state, s)
  const level = settings.ai[s]
  const seed = (state.round * 7919 + state.events.length * 31 + s) >>> 0
  if (actions.length === 1) return Promise.resolve(actions[0])
  if (!worker) return new Promise(r => setTimeout(() => r(MJAI.choose(view, s, actions, level, seed)), 0))
  return new Promise(resolve => {
    const id = ++reqId
    pending.set(id, { resolve, view, seat: s, actions, level, seed })
    worker.postMessage({ id, view, seat: s, actions, level, seed, timeMs: 1200 })
  })
}

const sleep = ms => new Promise(r => setTimeout(r, ms))

function aiDelay() {
  switch (state.phase) {
    case "dealerRoll": case "break": case "exchangeRoll": return settings.skipDice ? 250 : 900
    case "exchange": case "que": return 300
    case "claim": return 250
    default: return settings.speed
  }
}

async function schedule() {
  const my = gen
  if (!(state.phase === "claim" && MJ.pendingSeats(state).includes(0))) clearInterval(countdown)
  if (state.phase === "ended") return setTimeout(() => my === gen && showResult(), 1200)
  const seats = MJ.pendingSeats(state)
  if (seats.includes(0) && state.phase === "claim") startCountdown()
  const ai = seats.filter(s => s !== 0)
  if (!ai.length) return
  const started = Date.now()
  const a = await askAI(ai[0])
  await sleep(Math.max(0, aiDelay() - (Date.now() - started)))
  if (my !== gen) return
  setState(MJ.apply(state, ai[0], a))
}

const paused = () => document.hidden
let cdKey = ""
let cdLeft = 0
function startCountdown() {
  const c = state.claim
  const key = [state.round, c.kind, c.from, c.tile, state.players[c.from].discards.length, state.wall.length].join()
  if (key === cdKey) return
  cdKey = key
  cdLeft = 8
  clearInterval(countdown)
  const tick = () => {
    if (state.phase !== "claim" || !MJ.pendingSeats(state).includes(0)) return clearInterval(countdown)
    const el = $("cd")
    if (el) el.textContent = paused() ? "暂停" : cdLeft + "s"
    if (paused()) return
    if (cdLeft-- <= 0) {
      clearInterval(countdown)
      act({ type: "pass" })
    }
  }
  tick()
  countdown = setInterval(tick, 1000)
}

function nextRound() {
  closeModal()
  const n = MJ.nextRound(state)
  n.cap = settings.cap
  setState(n)
}

function openModal(body, buttons) {
  $("modal").innerHTML = `<div class="panel"><button class="x" data-close aria-label="关闭">×</button><div class="body">${body}</div><div class="btns">${buttons}</div></div>`
  $("modal").classList.add("open")
}
function closeModal() {
  $("modal").classList.remove("open")
}

const LEVELS = [["easy", "入门"], ["normal", "普通"], ["hard", "较强"], ["master", "大师"]]
const sign = n => (n > 0 ? "+" : "") + n

function resultRow(v, s) {
  const p = v.players[s]
  const delta = MJ.ledgerSum(v.ledger, s)
  let desc = ""
  let extra = ""
  if (p.won) {
    const how = p.won.selfDrawn ? "自摸" : `${SEAT_NAMES[p.won.from]}点炮`
    desc = `胡${ORDER_MARK[p.won.order]} ${T.name(p.won.tile)} · ${how}`
    extra = `<div class="fan">${fanText(p.won.score)}</div>`
  } else if (v.winOrder.length < 3) {
    if (MJ.isHuazhu(p)) desc = "花猪"
    else {
      const ws = MJ.waits(p.hand, p.que)
      desc = ws.length ? `听 ${ws.map(T.name).join(" ")}` : "未听牌"
    }
  }
  const tiles = sortTiles(p.hand, p.que).map(t => T.face(t, 22)).join("") + (p.won ? `<span style="width:6px"></span>${T.face(p.won.tile, 22, "tile last")}` : "") + p.melds.map(m => meld(m, 18)).join("")
  return `<div class="res"><div class="who">${SEAT_NAMES[s]}${v.dealer === s ? ' <span class="badge dealer" style="font-size:10px">庄</span>' : ""}</div>
    <div><div>${desc}</div>${extra}<div class="tiles">${tiles}</div></div>
    <div class="delta ${delta > 0 ? "up" : delta < 0 ? "down" : ""}">${sign(delta)}</div>
    <div class="tot">累计 ${sign(p.total)}</div></div>`
}

function showResult() {
  if (state.phase !== "ended") return
  const v = state
  const title = v.winOrder.length >= 3 ? `第 ${v.round + 1} 局结算` : `第 ${v.round + 1} 局结算 · 流局`
  const flow = v.ledger.map(e => `<div>${SEAT_NAMES[e.from]} → ${SEAT_NAMES[e.to]}　${e.note}　<b>${e.amount}</b></div>`).join("")
  openModal(`<h2>${title}</h2>${[0, 1, 2, 3].map(s => resultRow(v, s)).join("")}
    ${flow ? `<div class="flow">${flow}</div>` : ""}
`, `<button class="btn" data-close>看牌桌</button><button class="btn pri" data-next>再来一局</button>`)
}

function seg(key, options, value) {
  return `<span class="seg">${options.map(([v, label]) => `<button class="${JSON.stringify(v) === JSON.stringify(value) ? "on" : ""}" data-set='${JSON.stringify([key, v])}'>${label}</button>`).join("")}</span>`
}

function showSettings() {
  const rows = [1, 2, 3].map(s => `<div class="set-row"><span>${SEAT_NAMES[s]}难度</span>${seg("ai" + s, LEVELS, settings.ai[s])}</div>`)
  rows.push(`<div class="set-row"><span>封顶（新局生效）</span>${seg("cap", [[2, "2番"], [3, "3番"], [4, "4番"], [5, "5番"], [null, "不封顶"]], settings.cap)}</div>`)
  rows.push(`<div class="set-row"><span>听牌提示</span>${seg("hintWaits", [[true, "开"], [false, "关"]], settings.hintWaits)}</div>`)
  rows.push(`<div class="set-row"><span>出牌预览</span>${seg("hintPreview", [[true, "开"], [false, "关"]], settings.hintPreview)}</div>`)
  rows.push(`<div class="set-row"><span>动画速度</span>${seg("speed", SPEEDS, settings.speed)}</div>`)
  rows.push(`<div class="set-row"><span>跳过骰子动画</span>${seg("skipDice", [[true, "是"], [false, "否"]], settings.skipDice)}</div>`)
  rows.push(`<div class="set-row"><span>音效</span>${seg("sound", [[true, "开"], [false, "关"]], settings.sound)}</div>`)
  openModal(`<h2>设置</h2>${rows.join("")}`, `<button class="btn" id="btnNewMatch">新开一场</button><button class="btn pri" data-close>完成</button>`)
}

$("modal").addEventListener("click", e => {
  if (e.target === $("modal")) return closeModal()
  const b = e.target.closest("[data-set]")
  if (b) {
    const [key, v] = JSON.parse(b.dataset.set)
    if (key.startsWith("ai")) settings.ai[Number(key.slice(2))] = v
    else settings[key] = v
    save()
    render()
    showSettings()
  }
  if (e.target.closest("#btnNewMatch") && confirm("新开一场会清空累计分，确定吗？")) {
    closeModal()
    seenEvents = 0
    setState(MJ.newMatch({ seed: Date.now() >>> 0, cap: settings.cap }))
  }
})

// ---------- 音效 ----------
let audio = null
addEventListener("pointerdown", () => {
  if (!audio) try { audio = new AudioContext() } catch {}
  audio?.resume?.()
})

function tone(freq, dur, { type = "sine", gain = 0.15, at = 0, slide = 0 } = {}) {
  const t = audio.currentTime + at
  const o = audio.createOscillator()
  const g = audio.createGain()
  o.type = type
  o.frequency.setValueAtTime(freq, t)
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur)
  g.gain.setValueAtTime(gain, t)
  g.gain.exponentialRampToValueAtTime(0.001, t + dur)
  o.connect(g).connect(audio.destination)
  o.start(t)
  o.stop(t + dur)
}

function click(at = 0, gain = 0.25) {
  const t = audio.currentTime + at
  const buf = audio.createBuffer(1, audio.sampleRate * 0.04, audio.sampleRate)
  const d = buf.getChannelData(0)
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3
  const src = audio.createBufferSource()
  const g = audio.createGain()
  const f = audio.createBiquadFilter()
  f.type = "bandpass"
  f.frequency.value = 2400
  g.gain.value = gain
  src.buffer = buf
  src.connect(f).connect(g).connect(audio.destination)
  src.start(t)
}

function sound(e) {
  if (!settings.sound || !audio || audio.state !== "running") return
  switch (e.type) {
    case "draw": if (e.seat === 0) click(0, 0.12); break
    case "discard": click(0, 0.3); tone(180, 0.08, { type: "triangle", gain: 0.12 }); break
    case "roll": for (let i = 0; i < 6; i++) click(i * 0.08, 0.2); break
    case "peng": tone(520, 0.12, { type: "square", gain: 0.06 }); tone(780, 0.16, { type: "square", gain: 0.06, at: 0.1 }); break
    case "gang": [440, 554, 660].forEach((f, i) => tone(f, 0.18, { type: "square", gain: 0.06, at: i * 0.08 })); break
    case "hu": [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, { type: "triangle", gain: 0.12, at: i * 0.09 })); break
  }
}

selected = defaultSelection()
selKey = state.phase + "|" + state.players[0].hand.join() + "|" + state.drawn
render()
schedule()
</script>
